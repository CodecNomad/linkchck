[package]
name = "linkchck"
version = "0.1.0"
edition = "2024"
description = "A blazing-fast, asynchronous file link checker written in Rust."
license = "MIT"
repository = "https://github.com/CodecNomad/linkchck"
keywords = ["link-checker", "url-checker", "async", "cli"]
categories = ["command-line-utilities"]

[dependencies]
dashmap = "6.2.1"
futures = "0.3.34"
linkify = "0.11.0"
reqwest = "0.13.5"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }
